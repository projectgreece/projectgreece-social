name: Project Greece Social Publisher

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: "Run mode"
        required: true
        default: "integration-test"
        type: choice
        options:
          - integration-test
          - dry-run
          - publish
  # Production cron will be enabled after the integration test passes.

permissions:
  contents: read

jobs:
  social:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'integration-test' }}
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
      R2_BUCKET: ${{ vars.R2_BUCKET }}
      R2_PUBLIC_BASE_URL: ${{ vars.R2_PUBLIC_BASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - run: node src/run.js
